<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var theme = localStorage.getItem('app_theme_mode') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        // Desktop preview detection:
        // Show phone frame only when on a mouse/trackpad desktop browser (not in iframe, not forced mobile)
        try {
          var isInIframe   = window !== window.top;
          var isMobileFlag = location.search.indexOf('mobile=1') > -1;
          var isDesktop    = !isInIframe && !isMobileFlag &&
                             window.innerWidth > 900 &&
                             window.matchMedia('(pointer: fine)').matches;
          if (isDesktop) {
            window.__isDesktopShell = true;
            document.documentElement.classList.add('desktop-preview-shell');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trajectory" />
    <meta name="application-name" content="Trajectory" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trajectory | MLB Fan Standing & Rooting Companion</title>
    <!-- SEO Optimization -->
    <meta name="description" content="Trajectory helps baseball fans track daily MLB standings, schedules, and calculations like wild card math, magic numbers, and who to root for in other matchups." />
    <!-- Web App Capabilities (PWA) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Futuristic Google Fonts for App Icon Matching Sci-Fi Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Desktop preview phone-frame styles (inlined to avoid FOUC) -->
    <style>
      /* ── Mobile / non-desktop: completely hide phone frame wrapper ──────── */
      html:not(.desktop-preview-shell) #phone-frame-outer { display: none !important; }

      /* ── Desktop: hide the direct mobile app elements (iframe loads the app) */
      html.desktop-preview-shell #app,
      html.desktop-preview-shell #app-splash-screen { display: none !important; }

      /* ── Desktop phone-frame shell ────────────────────────────────────── */
      html.desktop-preview-shell, html.desktop-preview-shell body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden;
      }
      html.desktop-preview-shell body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        /* Dark desktop background with subtle cyan grid */
        background-color: #060810;
        background-image:
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(0,229,255,0.06) 0%, transparent 65%),
          linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
      }

      /* Desktop PREVIEW label */
      html.desktop-preview-shell body::after {
        content: 'DESKTOP PREVIEW';
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Orbitron', monospace;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: rgba(0, 229, 255, 0.18);
        pointer-events: none;
        z-index: 0;
      }

      /* Outer phone body */
      html.desktop-preview-shell #phone-frame-outer {
        position: relative;
        border-radius: 58px;
        padding: 14px;
        background: linear-gradient(155deg, #48484a 0%, #2c2c2e 30%, #1c1c1e 55%, #2c2c2e 80%, #3a3a3c 100%);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.13),
          0 0 0 2px rgba(0,0,0,0.85),
          inset 0 1px 0 rgba(255,255,255,0.2),
          inset 0 -1px 0 rgba(0,0,0,0.6),
          0 50px 140px rgba(0,0,0,0.95),
          0 0 80px rgba(0,0,0,0.6);
        z-index: 1;
        /* Volume up button (left, lower) */
      }
      /* Volume buttons - left side */
      html.desktop-preview-shell #phone-frame-outer::before {
        content: '';
        position: absolute;
        left: -4px;
        top: 160px;
        width: 3px;
        height: 34px;
        background: linear-gradient(180deg, #48484a, #2c2c2e);
        border-radius: 2px 0 0 2px;
        box-shadow: -1px 0 0 rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.12);
      }
      /* Power button - right side */
      html.desktop-preview-shell #phone-frame-outer::after {
        content: '';
        position: absolute;
        right: -4px;
        top: 185px;
        width: 3px;
        height: 70px;
        background: linear-gradient(180deg, #48484a, #2c2c2e);
        border-radius: 0 2px 2px 0;
        box-shadow: 1px 0 0 rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.12);
      }

      /* Phone screen bezel */
      html.desktop-preview-shell #phone-bezel {
        width: 393px;
        height: 852px;
        background: #000;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
      }

      /* App iframe - fills the screen area */
      html.desktop-preview-shell #phone-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        border-radius: 44px;
      }

      /* Dynamic Island */
      html.desktop-preview-shell #phone-dynamic-island {
        position: absolute;
        top: 13px;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 37px;
        background: #000;
        border-radius: 20px;
        z-index: 10;
        pointer-events: none;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.04);
      }

      /* Home indicator */
      html.desktop-preview-shell #phone-home-indicator {
        position: absolute;
        bottom: 9px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        background: rgba(255,255,255,0.32);
        border-radius: 3px;
        z-index: 10;
        pointer-events: none;
      }

      /* Volume down button (second left-side button, below the ::before one) */
      html.desktop-preview-shell #phone-vol-down {
        position: absolute;
        left: -4px;
        top: 205px;
        width: 3px;
        height: 64px;
        background: linear-gradient(180deg, #48484a, #2c2c2e);
        border-radius: 2px 0 0 2px;
        box-shadow: -1px 0 0 rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.12);
      }
      /* Silent switch */
      html.desktop-preview-shell #phone-silent {
        position: absolute;
        left: -4px;
        top: 110px;
        width: 3px;
        height: 32px;
        background: linear-gradient(180deg, #48484a, #2c2c2e);
        border-radius: 2px 0 0 2px;
        box-shadow: -1px 0 0 rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.12);
      }
    </style>
  </head>
  <body>
    <!-- ── Desktop phone-frame wrapper (invisible on mobile via display:contents) ── -->
    <div id="phone-frame-outer">
      <!-- Side buttons (decorative, desktop only) -->
      <div id="phone-silent"></div>
      <div id="phone-vol-down"></div>

      <!-- Phone screen -->
      <div id="phone-bezel">
        <div id="phone-dynamic-island"></div>
        <!-- App content: iframe on desktop, direct elements on mobile -->
        <iframe id="phone-iframe" title="Trajectory App" allowfullscreen></iframe>
        <div id="phone-home-indicator"></div>
      </div>
    </div>

    <!-- ── Normal mobile app content (rendered directly, no iframe) ── -->
    <div id="app"></div>
    <div id="app-splash-screen" class="splash-screen">
      <div class="splash-radar-bg"></div>
      <div class="splash-glow-orb splash-glow-1"></div>
      <div class="splash-glow-orb splash-glow-2"></div>
      <div class="splash-content">
        <div class="splash-icon-wrapper">
          <img src="/icon-512.png" alt="Trajectory" class="splash-icon-img" />
          <div class="splash-hud-ring"></div>
        </div>
        <div class="splash-title-container">
          <h1 class="splash-logo">TRAJECTORY</h1>
          <div class="splash-trajectory-line"></div>
        </div>
        <div class="splash-tagline">DAILY FAN INTELLIGENCE</div>
        <div class="splash-season">
          <span class="splash-badge-dot"></span>SYS.2026 // MLB RADAR
        </div>
        <div class="splash-loader-bar">
          <div class="splash-loader-progress"></div>
        </div>
        <div class="splash-status"><span class="status-prefix">[SYS.INIT]</span> Initializing standings & schedule...</div>
        <div class="splash-version">v2.0.2</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>

    <!-- ── Desktop shell setup ── -->
    <script>
      (function() {
        if (!window.__isDesktopShell) return;

        // Hide the direct mobile elements — they don't run in shell mode
        var appEl     = document.getElementById('app');
        var splashEl  = document.getElementById('app-splash-screen');
        if (appEl)    appEl.style.display    = 'none';
        if (splashEl) splashEl.style.display = 'none';

        // Point the iframe at ourselves with ?mobile=1 so it renders as the app
        var iframe = document.getElementById('phone-iframe');
        if (iframe) {
          var base = location.href.split('?')[0].split('#')[0];
          iframe.src = base + '?mobile=1' + (location.hash || '');
        }

        // ── Auto-scale the phone frame to always fit the visible viewport ──
        // Phone outer body natural dimensions (screen 393×852 + 14px padding each side)
        var PHONE_H = 880; // 852 + 14*2
        var PHONE_W = 421; // 393 + 14*2
        var MARGIN  = 20;  // px gap around phone (top+bottom combined, left+right combined)

        function scalePhoneToFit() {
          var outer = document.getElementById('phone-frame-outer');
          if (!outer) return;
          var availH = window.innerHeight - MARGIN;
          var availW = window.innerWidth  - MARGIN;
          var scale  = Math.min(availH / PHONE_H, availW / PHONE_W, 1);
          // CSS zoom: scales the element AND its layout footprint (unlike transform:scale)
          // Supported by all modern desktop browsers (Chrome, Edge, Safari, Firefox 126+)
          outer.style.zoom = scale;
        }

        scalePhoneToFit();
        window.addEventListener('resize', scalePhoneToFit);
      })();
    </script>
  </body>
</html>
